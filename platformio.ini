; HA_Display - LilyGo T5 4.7" e-paper (ESP32-S3) Home Assistant desk display
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = boards
default_envs = T5-ePaper-S3
; build output outside OneDrive (avoids syncing/locking thousands of .pio files)
build_dir = C:/pio-build/ha_display

[env:T5-ePaper-S3]
platform = espressif32@6.12.0
framework = arduino
board = T5-ePaper-S3
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
	-DLILYGO_T5_EPD47_S3
lib_deps =
	lewisxhe/SensorLib @ 0.3.1
	bblanchon/ArduinoJson @ ^7.4.2
